[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-draw"
version = "0.1.0"
description = "Drawing and geometric generative design tools for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "lambdawalker-list>=0.1.0",
    "lambdawalker-log>=0.1.0",
    "lambdawalker-random>=0.1.0",
    "lambdawalker-reflection>=0.1.0",
    "Pillow>=10.0.0",
    "aggdraw>=1.4.1",
    "cairosvg>=2.8.2",
    "hsluv>=5.0.4",
    "moderngl>=5.12.0",
    "noise>=1.2.2",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.draw"
Repository = "https://github.com/lambdawalker/python.lambdawalker.draw"
Issues = "https://github.com/lambdawalker/python.lambdawalker.draw/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.0",
]

[tool.uv.build-backend]
module-name = "lambdawalker.draw"
namespace = true

[tool.uv.sources]
lambdawalker-list = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.list.git" }
lambdawalker-log = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.log.git" }
lambdawalker-random = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.random.git" }
lambdawalker-reflection = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.reflection.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B311"]
